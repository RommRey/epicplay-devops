name: CI Pipeline - EpicPlay

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: epicplay_user
          POSTGRES_PASSWORD: epicplay_password
          POSTGRES_DB: epicplay_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar dependencias del sistema para OpenCV
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Instalar dependencias de Python
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Ejecutar Pruebas Automatizadas (Pytest)
      working-directory: ./backend
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: epicplay_user
        DB_PASSWORD: epicplay_password
        DB_NAME: epicplay_db
      run: |
        python -m pytest tests/test_lista.py -v