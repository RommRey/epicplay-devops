name: EpicPlay CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar código fuente
      uses: actions/checkout@v4

    - name: 2. Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 3. Instalar dependencias de pruebas
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: 4. Ejecutar Pruebas Automatizadas
      run: |
        # Aquí se ejecutarán automáticamente las pruebas que te asignen después
        pytest backend/tests/

    - name: 5. Construir Imagen Docker (Build Check)
      run: |
        docker build -t epicplay-backend:latest ./backend