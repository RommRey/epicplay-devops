version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: epicplay_db
    restart: always
    environment:
      POSTGRES_DB: epicplay_db
      POSTGRES_USER: epicplay_user
      POSTGRES_PASSWORD: epicplay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: epicplay_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@epicplay.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: epicplay_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.0.0
    container_name: epicplay_grafana
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data: