version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: epicplay-db
    restart: always
    environment:
      POSTGRES_DB: epicplay_db
      POSTGRES_USER: epicplay_user
      POSTGRES_PASSWORD: epicplay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: epicplay-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@epicplay.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: